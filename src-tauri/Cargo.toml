[package]
name = "adbox"
version = "1.0.2"
description = "ADBox — consola ADB libre para mantenimiento y reparación de Android"
authors = ["ADBox contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Descarga (HTTPS con raíces embebidas) y descompresión del ZIP oficial de
# platform-tools de Google, para la instalación automática de ADB.
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

