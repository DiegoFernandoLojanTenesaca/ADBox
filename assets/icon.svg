  <!-- Cuerpo (squircle) -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#sheen)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="none"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Prompt de terminal  >_  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="372,360 528,512 372,664" stroke="#ffffff" stroke-width="78"/>
