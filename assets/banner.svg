      <line x1="566" y1="652" x2="716" y2="652" stroke="#56d364" stroke-width="78"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="346" y="226" font-family="DejaVu Sans, sans-serif" font-size="118" font-weight="bold">
    <tspan fill="#4d96ff">ADB</tspan><tspan fill="#e6edf3">ox</tspan>
  </text>

  <!-- Tagline -->
