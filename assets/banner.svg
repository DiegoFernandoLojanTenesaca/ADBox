    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
